name: doaya_patient
description: Doaya patient app — AI consultation with your pharmacy, orders for pickup, dose reminders (Android + web).
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  doaya_ui: any
  doaya_core: any
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  http: ^1.6.0
  path_provider: ^2.1.6
  url_launcher: ^6.3.2
  web_socket_channel: ^3.0.3
  flutter_local_notifications: ^22.3.1
  workmanager: ^0.10.10
  timezone: ^0.11.1
  image_picker: ^1.2.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
