name: doaya_pharmacy
description: Doaya pharmacy app — offline POS, inventory, debts (Windows desktop + mobile).
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  doaya_ui: any
  doaya_core: any
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  crypto: ^3.0.7
  http: ^1.6.0
  path_provider: ^2.1.6
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
